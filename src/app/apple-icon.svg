<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="176" height="176" rx="38" stroke="url(#shieldGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Shield -->
  <path d="M90 28 L140 48 C140 102 90 142 90 152 C90 142 40 102 40 48 Z" 
        fill="#1E293B" 
        stroke="url(#shieldGrad)" 
        stroke-width="7" 
        stroke-linejoin="round"/>

  <!-- Dynamic Verification Trendline / Checkmark -->
  <path d="M64 92 L82 110 L120 66" 
        stroke="#10B981" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
